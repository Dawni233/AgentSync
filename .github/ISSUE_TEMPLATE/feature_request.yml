name: 功能建议
description: 提一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在使用中遇到的痛点或不便
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 AgentSync 如何解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他实现思路或现成工具可参考

  - type: textarea
    id: context
    attributes:
      label: 补充信息
