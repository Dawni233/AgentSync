[package]
name = "agentsync"
version = "0.1.0"
description = "AI Agent 配置同步工具"
authors = ["Dawni"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agentsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
# Phase 2+3: Git 同步 + 文件映射 + 存储
git2 = "0.19"
globset = "0.4"
shellexpand = "3.1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = "0.4"
walkdir = "2.5"
# Phase 4: 人格包导入导出
zip = "2.2"
# Phase 5: 自动同步定时器
tokio = { version = "1", features = ["time", "rt", "sync"] }

[dev-dependencies]
tempfile = "3.13"
